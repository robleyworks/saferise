<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SR-164 pattern; chrome copied verbatim from login.html/signup.html —
     per pass/AUTH-PAYMENTS-BRIEF.md Phase 2's own precedent, and this
     pass's own instruction: match the existing pages, same markup
     patterns, same classes, same voice. -->
<meta name="color-scheme" content="dark">
<style>html,body{background:#08080C}</style>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRise — Reset your password</title>
<meta name="description" content="Reset your SafeRise account password.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/saferise-system.css">
<link rel="stylesheet" href="css/saferise-footer.css">
</head>
<body class="sr-tp">

<a href="#main" class="sr-tp-skiplink">Skip to content</a>

<div id="srNav"></div>
<script src="js/saferise-nav.js"></script>
<script>SafeRiseNav.render('reset-password.html');</script>

<main class="sr-tp-shell" id="main">
  <div style="max-width:420px;margin:0 auto;padding:120px 20px 100px">
    <div class="sr-tp-band" style="text-align:center">

      <!-- SR-371 (PASS-auth-loop.md §2) · request step. Shown by default;
           hidden in favour of #srResetSetForm below when the page loads
           with a type=recovery fragment. -->
      <div id="srResetRequestView">
        <h1 style="margin-bottom:10px">Reset your password</h1>
        <p class="sr-tp-body" style="margin-bottom:28px">Enter your email and, if there's an account, we'll send a link to set a new password.</p>

        <form id="srResetRequestForm" novalidate>
          <label for="srResetEmail" style="display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;text-align:left">Email</label>
          <input type="email" id="srResetEmail" required autocomplete="email" placeholder="you@example.com"
            style="width:100%;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--hair);background:var(--band);color:var(--text);font:15px 'DM Sans',sans-serif;margin-bottom:20px;box-sizing:border-box">

          <button type="submit" class="sr-tp-pill" id="srResetRequestSubmit" style="width:100%;justify-content:center">Send reset link</button>
          <p id="srResetRequestNote" class="sr-tp-body" style="margin-top:14px;display:none"></p>
        </form>

        <p class="sr-tp-body" style="margin-top:22px"><a href="login.html">Back to sign in</a></p>
      </div>

      <!-- Set-new-password step. Reached only from the emailed link. -->
      <div id="srResetSetView" style="display:none">
        <h1 style="margin-bottom:10px">Set a new password</h1>
        <p class="sr-tp-body" style="margin-bottom:28px">&nbsp;</p>

        <form id="srResetSetForm" novalidate>
          <label for="srNewPassword" style="display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;text-align:left">New password</label>
          <input type="password" id="srNewPassword" required autocomplete="new-password" minlength="8" placeholder="At least 8 characters"
            style="width:100%;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--hair);background:var(--band);color:var(--text);font:15px 'DM Sans',sans-serif;margin-bottom:14px;box-sizing:border-box">

          <label for="srNewPasswordConfirm" style="display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;text-align:left">Confirm new password</label>
          <input type="password" id="srNewPasswordConfirm" required autocomplete="new-password" minlength="8" placeholder="Type it again"
            style="width:100%;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--hair);background:var(--band);color:var(--text);font:15px 'DM Sans',sans-serif;margin-bottom:20px;box-sizing:border-box">

          <button type="submit" class="sr-tp-pill" id="srResetSetSubmit" style="width:100%;justify-content:center">Set new password</button>
          <p id="srResetSetError" class="sr-tp-body" style="color:#E0716B;margin-top:14px;display:none"></p>
        </form>
      </div>

      <!-- Expired/used/malformed link. -->
      <div id="srResetFailView" style="display:none">
        <h1 style="margin-bottom:10px">That link no longer works</h1>
        <p id="srResetFailReason" class="sr-tp-body" style="margin-bottom:28px">Reset links expire, and each one works only once.</p>
        <a class="sr-tp-pill" href="reset-password.html" style="justify-content:center">Request a new link</a>
      </div>

    </div>
  </div>
</main>

<div id="srFooter"></div>
<script src="js/saferise-footer.js"></script>
<script>SafeRiseFooter.render();</script>

<script src="js/saferise-auth.js"></script>
<script>
(function () {
  var requestView = document.getElementById('srResetRequestView');
  var setView = document.getElementById('srResetSetView');
  var failView = document.getElementById('srResetFailView');
  function show(view) {
    [requestView, setView, failView].forEach(function (v) { v.style.display = v === view ? '' : 'none'; });
  }

  /* SR-371 (PASS-auth-loop.md §2) · the recovery link Supabase emails
     carries #access_token=...&type=recovery. handleAuthRedirect() is the
     same function index.html uses for signup/magic-link confirmation —
     shared, not duplicated, per the brief's own instruction. A recovery
     fragment establishes a real (short-lived) session the same way a
     normal sign-in does; updatePassword() below authenticates with that
     session's own bearer token. */
  var result = srAuth.handleAuthRedirect();
  if (result && result.type === 'recovery') {
    if (result.ok) {
      show(setView);
    } else {
      document.getElementById('srResetFailReason').textContent = result.error || 'Reset links expire, and each one works only once.';
      show(failView);
    }
  } else {
    show(requestView);
  }

  var reqForm = document.getElementById('srResetRequestForm');
  var reqNote = document.getElementById('srResetRequestNote');
  var reqSubmit = document.getElementById('srResetRequestSubmit');
  reqForm.addEventListener('submit', function (e) {
    e.preventDefault();
    reqSubmit.disabled = true;
    var email = document.getElementById('srResetEmail').value.trim();
    /* Never confirm or deny that an address is registered (PASS-auth-loop.md
       §2's own rule) — this note shows on success AND on a request failure
       alike. Only a genuinely broken submission (e.g. no network at all)
       still resolves through the same .then(), since requestPasswordReset()
       itself only rejects on a real transport failure, not on "no such
       account", which GoTrue itself never distinguishes either. */
    srAuth.requestPasswordReset(email).catch(function () {}).then(function () {
      reqNote.textContent = 'If there’s an account for ' + email + ', a reset link is on its way.';
      reqNote.style.display = 'block';
      reqForm.querySelector('input').setAttribute('disabled', 'disabled');
    });
  });

  var setForm = document.getElementById('srResetSetForm');
  var setErr = document.getElementById('srResetSetError');
  var setSubmit = document.getElementById('srResetSetSubmit');
  setForm.addEventListener('submit', function (e) {
    e.preventDefault();
    setErr.style.display = 'none';
    var p1 = document.getElementById('srNewPassword').value;
    var p2 = document.getElementById('srNewPasswordConfirm').value;
    if (p1 !== p2) {
      setErr.textContent = 'Those two passwords don’t match.';
      setErr.style.display = 'block';
      return;
    }
    setSubmit.disabled = true;
    srAuth.updatePassword(p1).then(function () {
      location.href = 'dashboard.html';
    }).catch(function (err) {
      setErr.textContent = (err && err.message) || 'Could not set a new password. Try again.';
      setErr.style.display = 'block';
      setSubmit.disabled = false;
    });
  });
})();
</script>
</body>
</html>
