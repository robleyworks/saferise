<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SR-164 · the ground colour, inline and first, ahead of every stylesheet.
     Without it the browser paints its default white until the sheet that sets
     the background has downloaded and parsed — a full-screen flash on every
     navigation of a dark site.
     This is not a new pattern: protocol.html and resource.html already carried
     exactly this pair, and it is copied from them rather than reinvented, down
     to `html,body` and the color-scheme hint. color-scheme:dark stops the UA
     painting a white canvas and hands scrollbars and form controls the dark
     rendering, which the background alone does not do.
     Deliberately a literal, not var(--bg): the token is defined by the very
     stylesheet this has to precede. Keep it equal to --bg for this page. -->
<meta name="color-scheme" content="dark">
<style>html,body{background:#08080C}</style>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRise — Professional Performance</title>
<meta name="description" content="You are the same nervous system at nine in the morning that you are at home.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<!-- The design system loads LAST, after every other stylesheet.
     It wins by cascade order, not by !important. -->
<link rel="stylesheet" href="css/saferise-system.css">
<link rel="stylesheet" href="css/saferise-footer.css">
</head>

<script>
/* AUTH-PAYMENTS-BRIEF Phase 3 gate — see relationship-healing.html for the
   full comment; identical pattern, this track's copy only. */
(async function () {
  var page = document.getElementById('page');
  var access = window.SafeRiseAccess;
  if (access && access.ready) { try { await access.ready; } catch (e) {} }
  var sticky = document.querySelector('.sr-tp-stickycta');
  var signedIn = !!(access && access.currentUser());
  var entitled = !!(access && access.hasAccess('t3-p01'));
  if (!signedIn || !entitled) { if (sticky) sticky.style.display = 'none'; }
  if (!signedIn) {
    page.innerHTML =
      '<div class="sr-tp-shell" style="padding:120px 20px">' +
        '<div class="sr-tp-band" style="max-width:640px;margin:0 auto;text-align:center">' +
          '<h2>Sign in to open Professional Performance</h2>' +
          '<p class="sr-tp-body">Personal Transformation is free for anyone. Professional Performance needs an account.</p>' +
          '<p style="margin-top:24px"><a class="sr-tp-pill" href="login.html?next=professional-performance.html">Sign in</a></p>' +
          '<p class="sr-tp-body" style="margin-top:16px"><a href="signup.html?next=professional-performance.html">Create an account</a></p>' +
        '</div>' +
      '</div>';
    return;
  }
  if (!entitled) {
    page.innerHTML =
      '<div class="sr-tp-shell" style="padding:120px 20px">' +
        '<div class="sr-tp-band" style="max-width:640px;margin:0 auto;text-align:center">' +
          '<h2>Professional Performance needs the full plan</h2>' +
          '<p class="sr-tp-body">You are signed in &mdash; Personal Transformation stays included either way. Everything else needs an upgrade.</p>' +
          '<p style="margin-top:24px"><a class="sr-tp-pill" href="account.html">See plans</a></p>' +
        '</div>' +
      '</div>';
    return;
  }
  SafeRiseTrack.render(3);
})();
</script>
</body>
</html>
