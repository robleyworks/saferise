<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- SR-164 pattern; chrome copied verbatim from personal-transformation.html —
     see pass/AUTH-PAYMENTS-BRIEF.md Phase 2. -->
<meta name="color-scheme" content="dark">
<style>html,body{background:#08080C}</style>
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SafeRise — Sign in</title>
<meta name="description" content="Sign in to your SafeRise account.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/saferise-system.css">
<link rel="stylesheet" href="css/saferise-footer.css">
</head>
<body class="sr-tp">

<a href="#main" class="sr-tp-skiplink">Skip to content</a>

<div id="srNav"></div>
<script src="js/saferise-nav.js"></script>
<script>SafeRiseNav.render('login.html');</script>

<main class="sr-tp-shell" id="main">
  <div style="max-width:420px;margin:0 auto;padding:120px 20px 100px">
    <div class="sr-tp-band" style="text-align:center">
      <h1 style="margin-bottom:10px">Sign in</h1>
      <p class="sr-tp-body" style="margin-bottom:28px">&nbsp;</p>

      <form id="srLoginForm" novalidate>
        <label for="srEmail" style="display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;text-align:left">Email</label>
        <input type="email" id="srEmail" required autocomplete="email" placeholder="you@example.com"
          style="width:100%;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--hair);background:var(--band);color:var(--text);font:15px 'DM Sans',sans-serif;margin-bottom:14px;box-sizing:border-box">

        <label for="srPassword" style="display:block;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--text3);margin-bottom:6px;text-align:left">Password</label>
        <input type="password" id="srPassword" required autocomplete="current-password" placeholder="Your password"
          style="width:100%;min-height:44px;padding:0 14px;border-radius:8px;border:1px solid var(--hair);background:var(--band);color:var(--text);font:15px 'DM Sans',sans-serif;margin-bottom:20px;box-sizing:border-box">

        <button type="submit" class="sr-tp-pill" id="srLoginSubmit" style="width:100%;justify-content:center">Sign in</button>
        <p id="srLoginError" class="sr-tp-body" style="color:#E0716B;margin-top:14px;display:none"></p>
      </form>

      <!-- SR-371 (PASS-auth-loop.md §2) · was absent — no way back in for a
           member who forgets a password. -->
      <p class="sr-tp-body" style="margin-top:14px">
        <a href="reset-password.html">Forgot your password?</a>
      </p>
      <p class="sr-tp-body" style="margin-top:22px">
        <a href="#" id="srMagicLinkTrigger">Email me a sign-in link instead</a>
      </p>
      <p id="srMagicLinkNote" class="sr-tp-body" style="margin-top:10px;display:none"></p>

      <p class="sr-tp-body" style="margin-top:22px">New here? <a href="signup.html" id="srToSignup">Create an account</a></p>
    </div>
  </div>
</main>

<div id="srFooter"></div>
<script src="js/saferise-footer.js"></script>
<script>SafeRiseFooter.render();</script>

<script src="js/saferise-auth.js"></script>
<script src="js/saferise-access.js"></script>
<script>
(function () {
  function nextParam() {
    var m = /[?&]next=([^&]+)/.exec(location.search);
    return m ? decodeURIComponent(m[1]) : 'dashboard.html';
  }
  var signup = document.getElementById('srToSignup');
  if (signup) signup.href = 'signup.html?next=' + encodeURIComponent(nextParam());

  var form = document.getElementById('srLoginForm');
  var errEl = document.getElementById('srLoginError');
  var submitBtn = document.getElementById('srLoginSubmit');
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errEl.style.display = 'none';
    submitBtn.disabled = true;
    var email = document.getElementById('srEmail').value.trim();
    var password = document.getElementById('srPassword').value;
    srAuth.signIn(email, password).then(function () {
      location.href = nextParam();
    }).catch(function (err) {
      errEl.textContent = (err && err.message) || 'Could not sign in. Check your email and password.';
      errEl.style.display = 'block';
      submitBtn.disabled = false;
    });
  });

  var magic = document.getElementById('srMagicLinkTrigger');
  var magicNote = document.getElementById('srMagicLinkNote');
  magic.addEventListener('click', function (e) {
    e.preventDefault();
    var email = document.getElementById('srEmail').value.trim();
    if (!email) {
      magicNote.textContent = 'Enter your email above first.';
      magicNote.style.display = 'block';
      return;
    }
    srAuth.sendMagicLink(email).then(function () {
      magicNote.textContent = 'Check ' + email + ' for a sign-in link.';
      magicNote.style.display = 'block';
    }).catch(function (err) {
      magicNote.textContent = (err && err.message) || 'Could not send a link. Try again.';
      magicNote.style.display = 'block';
    });
  });
})();
</script>
</body>
</html>
